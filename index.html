<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Todo Software</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"/>
  <style>
    body {
      background: #f0f2f5;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }
    .todo-container {
      max-width: 600px;
      margin: 50px auto;
      background: #fff;
      padding: 30px;
      border-radius: 15px;
      box-shadow: 0 0 20px rgba(0,0,0,0.1);
    }
    .task-complete {
      text-decoration: line-through;
      color: #6c757d;
    }
    .form-check-input {
      cursor: pointer;
    }
  </style>
</head>
<body>
  <div class="container todo-container">
    <h2 class="text-center mb-4">📝 Todo List</h2>
    <div class="input-group mb-3">
      <input type="text" id="taskInput" class="form-control" placeholder="Enter new task">
      <button class="btn btn-primary" onclick="addTask()">Add</button>
    </div>
    <ul id="taskList" class="list-group"></ul>
  </div>

  <script>
    let tasks = [];

    // Load from localStorage
    function loadTasks() {
      const storedTasks = localStorage.getItem('todoTasks');
      if (storedTasks) {
        tasks = JSON.parse(storedTasks);
      }
    }

    // Save to localStorage
    function saveTasks() {
      localStorage.setItem('todoTasks', JSON.stringify(tasks));
    }

    function renderTasks() {
      const taskList = document.getElementById('taskList');
      taskList.innerHTML = '';
      tasks.forEach((task, index) => {
        const li = document.createElement('li');
        li.className = 'list-group-item d-flex justify-content-between align-items-center';

        const leftSide = document.createElement('div');
        leftSide.className = 'form-check';

        const checkbox = document.createElement('input');
        checkbox.type = 'checkbox';
        checkbox.className = 'form-check-input me-2';
        checkbox.checked = task.completed;
        checkbox.onclick = () => toggleComplete(index);

        const label = document.createElement('label');
        label.className = `form-check-label ${task.completed ? 'task-complete' : ''}`;
        label.innerText = task.name;

        leftSide.appendChild(checkbox);
        leftSide.appendChild(label);

        const btnGroup = document.createElement('div');
        const editBtn = document.createElement('button');
        editBtn.className = 'btn btn-sm btn-warning me-2';
        editBtn.innerText = 'Edit';
        editBtn.onclick = () => editTask(index);

        const deleteBtn = document.createElement('button');
        deleteBtn.className = 'btn btn-sm btn-danger';
        deleteBtn.innerText = 'Delete';
        deleteBtn.onclick = () => deleteTask(index);

        btnGroup.appendChild(editBtn);
        btnGroup.appendChild(deleteBtn);

        li.appendChild(leftSide);
        li.appendChild(btnGroup);
        taskList.appendChild(li);
      });

      saveTasks(); // Save whenever tasks are rendered
    }

    function addTask() {
      const taskInput = document.getElementById('taskInput');
      const taskName = taskInput.value.trim();
      if (taskName) {
        tasks.push({ name: taskName, completed: false });
        taskInput.value = '';
        renderTasks();
      }
    }

    function toggleComplete(index) {
      tasks[index].completed = !tasks[index].completed;
      renderTasks();
    }

    function deleteTask(index) {
      tasks.splice(index, 1);
      renderTasks();
    }

    function editTask(index) {
      const newName = prompt('Edit your task:', tasks[index].name);
      if (newName && newName.trim()) {
        tasks[index].name = newName.trim();
        renderTasks();
      }
    }

    // Initial load
    loadTasks();
    renderTasks();
  </script>
</body>
</html>
